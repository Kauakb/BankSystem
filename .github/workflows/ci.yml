name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ca-2-algorithms-architecture-design-patterns-Kauakb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # The NetBeans project targets Java 24, so compile with --release 24
      - name: Compile
        run: javac -Xlint:all --release 24 -d out $(find src -name '*.java')

      # Drive the console app through every menu option with scripted input
      - name: Smoke test
        run: |
          printf 'Applicants_Form.txt\n1\n2\nKate Summer\n4\n20\n5\n' \
            | java -cp out Main | tee output.txt
          for expected in \
              "Loaded:" \
              "=== Sorted Employees (First 20) ===" \
              "=== Employee Found ===" \
              "Total Nodes: 20" \
              "Thank you for using KBank system!"; do
            grep -qF "$expected" output.txt || { echo "::error::Missing output: $expected"; exit 1; }
          done
