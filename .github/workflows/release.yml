name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build jar and publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ca-2-algorithms-architecture-design-patterns-Kauakb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build jar
        run: |
          javac --release 24 -d out $(find src -name '*.java')
          jar --create --file BankSystem.jar --main-class Main -C out .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" BankSystem.jar Applicants_Form.txt \
            --title "$GITHUB_REF_NAME" --generate-notes
